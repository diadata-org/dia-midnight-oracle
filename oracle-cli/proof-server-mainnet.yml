# Proof server for preprod and mainnet: both run ledger 9 with proof server 9.0.0 (Midnight
# compatibility matrix, updated 12 Nov 2026). Proofs are generated locally; never use a remote one.
services:
  proof-server:
    image: "midnightntwrk/proof-server:9.0.0"
    command: ["midnight-proof-server"]
    ports:
      - "127.0.0.1:6300:6300" # local only
    environment:
      RUST_BACKTRACE: "full"
