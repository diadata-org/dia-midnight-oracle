# Proof server for preprod and mainnet: both run node 1.0.400 / ledger 8.1.3 (Midnight
# compatibility matrix, updated 2 Nov 2026). Proofs are generated locally; never use a remote one.
services:
  proof-server:
    image: "midnightntwrk/proof-server:9.0.0"
    command: ["midnight-proof-server"]
    ports:
      - "127.0.0.1:6300:6300" # local only
    environment:
      RUST_BACKTRACE: "full"
